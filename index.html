<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Architectural Studio</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="app">
    <canvas id="webgl-canvas"></canvas>

    <!-- Overlay Loading & Toast Notifications -->
    <div id="loader" class="loader-overlay hidden">
      <div class="spinner"></div>
      <p id="loader-text">جاري التحميل...</p>
    </div>

    <!-- Top Action Bar -->
    <header class="top-bar">
      <div class="brand">3D ARCHITECTURAL STUDIO</div>
      <div class="top-actions">
        <label class="btn btn-secondary" for="model-input">رفع نموذج 3D</label>
        <input type="file" id="model-input" accept=".glb,.gltf" hidden>
        <button id="btn-demo" class="btn btn-primary">تحميل المبنى الافتراضي</button>
        <button id="btn-fullscreen" class="btn btn-icon">⛶</button>
      </div>
    </header>

    <!-- Left Toolbar Mode Control -->
    <aside class="sidebar right-panel">
      <div class="panel-section">
        <h3>نمط الكاميرا</h3>
        <div class="grid-2">
          <button id="mode-orbit" class="btn btn-mode active">مدار (Orbit)</button>
          <button id="mode-fps" class="btn btn-mode">تجول (First Person)</button>
          <button id="mode-top" class="btn btn-mode">من الأعلى</button>
          <button id="mode-front" class="btn btn-mode">من الأمام</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>الإضاءة والوقت</h3>
        <div class="grid-3">
          <button id="time-day" class="btn btn-preset">نهار</button>
          <button id="time-sunset" class="btn btn-preset">غروب</button>
          <button id="time-night" class="btn btn-preset">ليل</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>أدوات القياس</h3>
        <button id="btn-measure" class="btn btn-secondary full-width">تفعيل أداة القياس</button>
        <p id="measure-result" class="measure-text">المسافة: -</p>
      </div>

      <div class="panel-section">
        <h3>أنماط سينمائية جاهزة</h3>
        <select id="preset-select" class="select-input">
          <option value="">اختر نمطاً جاهزاً...</option>
          <option value="reveal">كشف معماري (Architectural Reveal)</option>
          <option value="exterior">دوران خارجي (Exterior Orbit)</option>
          <option value="interior">جولة داخلية (Interior Walk)</option>
        </select>
      </div>
    </aside>

    <!-- Mobile Virtual Joystick Container -->
    <div id="joystick-container" class="joystick-container hidden">
      <div id="joystick-base" class="joystick-base">
        <div id="joystick-stick" class="joystick-stick"></div>
      </div>
    </div>

    <!-- Timeline & Video Control Panel -->
    <footer class="bottom-bar">
      <div class="timeline-controls">
        <button id="btn-play" class="btn btn-icon">▶</button>

        <button id="btn-stop" class="btn btn-icon">⏹</button>
        <button id="btn-add-keyframe" class="btn btn-secondary">+ إضافة لقطة</button>
        <span id="timeline-time" class="time-display">00:00 / 00:10</span>
      </div>
      
      <div class="timeline-slider-container">
        <input type="range" id="timeline-slider" min="0" max="10" step="0.1" value="0">
        <div id="keyframe-markers" class="keyframe-markers"></div>
      </div>

      <div class="export-controls">
        <select id="export-resolution" class="select-input small">
          <option value="720p">720p HD</option>
          <option value="1080p">1080p FHD</option>
        </select>
        <select id="export-fps" class="select-input small">
          <option value="30">30 FPS</option>
          <option value="60">60 FPS</option>
        </select>
        <button id="btn-record" class="btn btn-danger">تسجيل فيديو MP4</button>
      </div>
    </footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
